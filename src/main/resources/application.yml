spring:
  application:
    name: oficioya-search

server:
  port: 8081

oficioya:
  security:
    # Secreto compartido con Identity (Squad 1). En producción se define con la variable JWT_SECRET.
    jwt-secret: ${JWT_SECRET:cambiar-este-secreto-de-desarrollo-de-al-menos-32-bytes}
    roles-claim: ${JWT_ROLES_CLAIM:roles}
  orquestador:
    # Toda comunicación con otros dominios o con la IA sale por el Orchestrator.
    base-url: ${ORQUESTADOR_URL:http://localhost:8080}
    # Rutas del Orchestrator hacia otros dominios y la IA (pendientes de confirmar con Squad 1).
    rutas:
      trabajadores-activos: /api/workers/trabajadores/activos
      oficios: /api/workers/oficios
      reputaciones: /api/reputation/reputaciones
      interpretacion-ia: /api/ia/interpretaciones
  ia:
    # simulado: identifica el oficio por palabras clave (sprint 3).
    # orquestador: consulta la IA (Gemini) a través del Orchestrator (sprint 4).
    modo: ${IA_MODO:simulado}
    umbral-confianza: 0.6
  search:
    # Cantidad de sugerencias en la búsqueda en lenguaje natural (los de mayor reputación).
    max-sugerencias: 10

# Documentación de la API (Swagger UI en /swagger-ui.html). Se puede apagar con SWAGGER_ENABLED=false.
springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    operations-sorter: method
    tags-sorter: alpha

logging:
  level:
    edu.eci.dosw.oficioya: INFO
